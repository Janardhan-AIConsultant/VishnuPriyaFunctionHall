services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vishnupriya}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vishnupriya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}@postgres:5432/${POSTGRES_DB:-vishnupriya}
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: grok
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_MODEL: grok-3
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_CONTACT_NUMBER: ${WHATSAPP_CONTACT_NUMBER:-}
      PAYMENT_MERCHANT_PHONE: ${PAYMENT_MERCHANT_PHONE:-}
      PAYMENT_MERCHANT_UPI_ID: ${PAYMENT_MERCHANT_UPI_ID:-}
      PAYMENT_MERCHANT_NAME: ${PAYMENT_MERCHANT_NAME:-Vishnu Priya Function Hall}
      PAYMENT_DEFAULT_ADVANCE_INR: ${PAYMENT_DEFAULT_ADVANCE_INR:-15000}
      PHONEPE_MERCHANT_ID: ${PHONEPE_MERCHANT_ID:-}
      PHONEPE_SALT_KEY: ${PHONEPE_SALT_KEY:-}
      PHONEPE_SALT_INDEX: ${PHONEPE_SALT_INDEX:-1}
      PHONEPE_ENV: ${PHONEPE_ENV:-UAT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  pgdata:
